<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚马逊广告 数据优化站｜工具页</title><link rel="stylesheet" href="../assets/app.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="../"><span class="brand-mark">A</span><span>亚马逊广告 数据优化站</span></a><nav class="nav"><a class="active" href="../tool/">工具页</a><a href="../report/">报告页</a><button id="theme-toggle" class="secondary theme-toggle" type="button"></button><button id="sign-out" class="secondary" type="button">退出</button></nav></header><section class="page-head"><div><div class="eyebrow">NEW TASK</div><h1 class="page-title">创建关键词作战任务</h1><p class="muted">先传文件，再写任务行；任务完成后在列表里在线查看报告。</p></div><div class="account-pill" id="user-email">正在读取账户…</div></section><article class="card submit-card"><form id="task-form" class="task-form"><div class="field"><label for="asin">ASIN</label><input id="asin" maxlength="10" required placeholder="例如 B09V366BDY" inputmode="latin" autocomplete="off"></div><div class="field file-field"><label for="report-file">广告搜索词报表</label><input id="report-file" type="file" accept=".xlsx,.csv" required><small>仅支持 .xlsx / .csv，最大 10MB</small></div><button id="submit-task" type="submit">提交给后台工人</button></form><div id="message" class="message"></div></article><section class="info-grid"><article class="card mini-card"><h3>固定提交顺序</h3><p class="muted">浏览器生成任务号 → 上传到私有收件箱 → 插入待处理任务。两步都成功才算提交成功。</p></article><article class="card mini-card"><h3>报表要求</h3><p class="muted">至少包含搜索词、展示量、点击量、花费，以及订单或销售额/ACOS 列；系统按表头自动识别。</p></article><article class="card mini-card"><h3>刷新节奏</h3><p class="muted">任务列表每 30 秒自动刷新；失败任务会直接显示人话版失败原因。</p></article></section><article class="card"><div class="section-bar"><div><h2>我的任务</h2><p class="muted compact">最近任务优先展示，完成后点击“查看报告”。</p></div><button id="refresh-tasks" class="secondary" type="button">手动刷新</button></div><div id="task-list"></div></article></main><script src="../assets/vendor/supabase.js"></script><script src="../assets/app-config.js"></script><script src="../assets/app.js"></script></body></html>
